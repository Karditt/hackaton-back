# Перекрытия по типам съёмки.
#
# Отдельный конфиг — прямое требование заказчика (docs/customer_qa.md, №25):
# «Пусть в решении это будет отдельный конфиг, в котором настраивается
# перекрытие между галсами для каждого вида съёмки».
#
# ПРАВИЛО (инвариант 5): у каждого числа есть `source`. Значение заказчика
# помечено «заказчик, №N», решение команды — «ДОПУЩЕНИЕ КОМАНДЫ».
#
#   forward_overlap   — продольное перекрытие по умолчанию, доля 0..1
#   side_overlap      — поперечное перекрытие по умолчанию, доля 0..1
#   min_side_overlap  — меньше этого сценарий отвергается на приёме
#
# Если в сценарии перекрытие задано явно, берётся оно — но не ниже min_side_overlap.

presets:
  rgb:
    forward_overlap:
      value: 0.70
      source: >-
        Значение по умолчанию GeoScan Planner 2.5 (модель FlightTaskSet,
        defaultForwardOverlap = 0.7) — docs/planner_reference.md §3. Решение
        владельца 2026-09-24: берём значения производителя. Прежнее допущение
        команды 0,80 отменено
    side_overlap:
      value: 0.50
      source: >-
        Значение по умолчанию GeoScan Planner 2.5 (defaultLateralOverlap = 0.5)
        — docs/planner_reference.md §3, совпадает с минимумом заказчика (№25).
        Решение владельца 2026-09-24. Прежнее допущение команды 0,60 отменено
    min_side_overlap:
      value: 0.50
      source: "Заказчик, №25: «для аэрофотосъёмки минимальное перекрытие между галсами это 50%»"

  multispectral:
    forward_overlap:
      value: 0.70
      source: "Как у аэрофотосъёмки — заказчик, №25: «это же всё касается и мультиспектральной». Значение производителя, решение владельца 2026-09-24"
    side_overlap:
      value: 0.50
      source: "Как у аэрофотосъёмки. Значение производителя, решение владельца 2026-09-24"
    min_side_overlap:
      value: 0.50
      source: "Заказчик, №25: минимум 50% касается и мультиспектральной съёмки"

  ir:
    forward_overlap:
      value: 0.70
      source: "Как у аэрофотосъёмки — заказчик, №25: «это же всё касается и тепловизионной». Значение производителя, решение владельца 2026-09-24"
    side_overlap:
      value: 0.50
      source: "Как у аэрофотосъёмки. Значение производителя, решение владельца 2026-09-24"
    min_side_overlap:
      value: 0.50
      source: "Заказчик, №25: минимум 50% касается и тепловизионной съёмки"

  lidar:
    forward_overlap:
      value: 0.0
      source: "ДОПУЩЕНИЕ КОМАНДЫ: у лидара нет кадров, продольное перекрытие не применяется"
    side_overlap:
      value: 0.30
      source: "ДОПУЩЕНИЕ КОМАНДЫ: заказчик, №25: «если брать лидарную съёмку, там наверное поменьше»"
    min_side_overlap:
      value: 0.20
      source: "ДОПУЩЕНИЕ КОМАНДЫ: нижняя граница для стыковки полос сканирования"

  geophysical:
    forward_overlap:
      value: 0.0
      source: "ДОПУЩЕНИЕ КОМАНДЫ: кадровой съёмки нет, продольное перекрытие не применяется"
    side_overlap:
      value: 0.0
      source: "ДОПУЩЕНИЕ КОМАНДЫ: межгалсовый шаг задаётся методикой съёмки, а не перекрытием"
    min_side_overlap:
      value: 0.0
      source: "ДОПУЩЕНИЕ КОМАНДЫ: перекрытие полос не требуется"
