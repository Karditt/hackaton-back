# ---------------------------------------------------------------------------
# Параметры, которых нет НИ В ОДНОМ источнике и которые живут
# в core/assumptions.py как явные правила заполнения пробелов:
#
#   - крейсерская скорость Геоскан 201, 401, 801, Gemini (у Lite и 201 Термо — с сайта)
#   - радиус разворота самолётов (из скорости и крена)
#   - размер матрицы Riebo R4/R6 — из формата «полный кадр» (36 × 24 мм)
#
# Пробелы, закрываемые только ответом заказчика (docs/customer_qa.md §4):
#   - фокусное объектива Sony ZV-E10 в комплектах Геоскана
