# Технические характеристики БВС.
#
# ПРАВИЛО (инвариант 6 брифа): ни одно число здесь не выдумывается.
# У каждого параметра есть поле `source` с документом и страницей.
# Неизвестная характеристика — `value: null` и `gap:` с описанием пробела,
# а НЕ правдоподобное число.
#
# Единицы — СИ (метры, секунды, м/с, Вт·ч, радианы). В `source` при
# необходимости указано исходное значение в единицах документа.
#
# Источники. Документы производителя лежат в docs/ (выдержки нужных страниц,
# номера страниц — как в полном руководстве). Веб-страницы geoscan.ru с машины
# разработки не открываются, поэтому даны копии веб-архива с датой снимка.
#
#   Руководства и буклеты Геоскан (download.geoscan.ru):
#   [201]       docs/Geoscan_201.pdf         — руководство 201, стр. 115–117 (в издании 2025 г. те же)
#   [201-камеры] docs/Geoscan_201_cameras.pdf — руководство 201 (2025), стр. 44–45 (Riebo), 55 (ZV-E10)
#   [401]       docs/Geoscan_401.pdf         — руководство 401, стр. 125–127
#   [Lite]      docs/Geoscan_Lite.pdf        — руководство Lite (2024), стр. 11, 42, 91–93
#   [801]       docs/Geoscan_801.pdf         — рекламный буклет 801, стр. 3–4
#   [801-РЭ]    docs/Geoscan_801_Manual.pdf  — руководство 801, стр. 87–90
#   [Gemini]    docs/Gemini_Specs_EN_RUS.pdf — спецификация Gemini, стр. 1–6
#
#   Страницы продуктов geoscan.ru (веб-архив):
#   [сайт-201]    https://web.archive.org/web/20251122210817/https://www.geoscan.ru/ru/products/geoscan201/geo
#   [сайт-201Т]   https://web.archive.org/web/20260203043012/https://www.geoscan.ru/ru/products/geoscan201/t
#   [сайт-401]    https://web.archive.org/web/20251203200155/https://www.geoscan.ru/ru/products/geoscan401/geo
#   [сайт-Lite]   https://web.archive.org/web/20240915133344/https://www.geoscan.ru/ru/products/lite
#   [сайт-Gemini] https://web.archive.org/web/20251214234015/https://www.geoscan.ru/ru/products/gemini-m
#
#   Производители камер (проверено 2026-09-19):
#   [Sony-RX1RM2] https://www.sony.co.uk/electronics/support/compact-cameras-dsc-rx-series/dsc-rx1rm2/specifications
#   [Sony-RX1RM3] https://www.sony.co.uk/electronics/cyber-shot-compact-cameras/dsc-rx1rm3/specifications
#   [Sony-ZVE10]  https://www.sony.co.uk/electronics/support/e-mount-body-zv-e-series/zv-e10/specifications
#   [Фотоника]    https://www.npk-photonica.ru/product/18246/ — НПК «Фотоника», тепловизор VLM640.
#                 На 2026-09-19 страница снята («Элемент не найден»); числа — по её
#                 копии в поисковом индексе. Источник слабее прочих.
#
#   Дилеры Геоскана — НЕ документ производителя, используются только как
#   дополнение к нему и всегда названы в `source`:
#   [Русгеоком-R4]    https://www.rusgeocom.ru/products/bpla-geoscan-201-sonyrx1rii
#   [Русгеоком-ZVE10] https://www.rusgeocom.ru/products/bpla-geoscan-201-sonyzve10
#   [DroneMarket-R6]  https://dronemarket.kz/catalog/payloads/riebo-r6-61-mp/
#
# Не включены: Геоскан 701 — снят с производства (решение владельца проекта
# 2026-09-19); Геоскан 401 Лидар — лидар не укладывается в модель «GSD → высота»
# (заказчик, №26); Геоскан 201 Видео — не съёмочный.

# Ссылки на источники словами — так их видит пользователь в карточке нагрузки и
# в пробелах каталога: «[201] стр. 115» → «руководство Геоскан 201, стр. 115».
references:
  "201": руководство Геоскан 201
  "201-камеры": руководство Геоскан 201 (2025), раздел о камерах
  "401": руководство Геоскан 401
  "Lite": руководство Геоскан Lite (2024)
  "801": буклет Геоскан 801
  "801-РЭ": руководство Геоскан 801
  "Gemini": спецификация Геоскан Gemini
  "сайт-201": страница Геоскан 201 на geoscan.ru
  "сайт-201Т": страница Геоскан 201 Термо на geoscan.ru
  "сайт-401": страница Геоскан 401 на geoscan.ru
  "сайт-Lite": страница Геоскан Lite на geoscan.ru
  "сайт-Gemini": страница Геоскан Gemini на geoscan.ru
  "Sony-RX1RM2": паспорт Sony DSC-RX1RM2
  "Sony-RX1RM3": паспорт Sony DSC-RX1RM3
  "Sony-ZVE10": паспорт Sony ZV-E10
  "Фотоника": страница НПК «Фотоника»
  "Русгеоком-R4": дилер «Русгеоком»
  "Русгеоком-ZVE10": дилер «Русгеоком»
  "DroneMarket-R6": дилер DroneMarket

vehicles:
  - id: geoscan-201
    name: Геоскан 201
    type: fixed_wing

    airspeed_min_mps:
      value: 17.8
      source: "[201] стр. 115, «Скорость полета (воздушная) 64–130 км/ч» → 64 км/ч"
    airspeed_max_mps:
      value: 36.1
      source: "[201] стр. 115, «Скорость полета (воздушная) 64–130 км/ч» → 130 км/ч"
    cruise_speed_mps:
      value: null
      # Правило заполнения — FIXED_WING_CRUISE_FRACTION_OF_RANGE в core/assumptions.py.
      gap: >-
        Крейсерская скорость в руководстве не выделена, дан только диапазон
        воздушной скорости 64–130 км/ч. [сайт-201]: «Скорость полета: до
        110 км/ч» — это верхняя граница, а не крейсер. Для расчёта принята
        середина диапазона воздушной скорости — 97 км/ч.

    endurance_s:
      value: 10800
      source: "[201] стр. 115, «Макс. продолжительность полета 180 мин»"
    max_range_m:
      value: 210000
      source: "[201] стр. 115, «Максимальная протяженность маршрута 210 км»"
    max_wind_mps:
      value: 12.0
      source: "[201] стр. 115, «Макс. допустимая скорость ветра 12 м/с»"

    max_takeoff_mass_kg:
      value: 8.5
      source: "[201] стр. 115, «Макс. взлетная масса 8,5 кг»"
    max_payload_mass_kg:
      value: 1.5
      source: "[201] стр. 115, «Макс. масса полезной нагрузки 1,5 кг»"
    wingspan_m:
      value: 2.22
      source: "[201] стр. 115, «Размах крыла 2,22 м»"

    min_safe_altitude_m:
      value: 100
      source: "[201] стр. 115, «Мин. безопасная высота полета 100 м»"
    max_altitude_m:
      value: 4000
      source: "[201] стр. 115, «Макс. высота полета 4000 м»"

    turn_radius_m:
      value: null
      # Правило заполнения — fixed_wing_turn_radius_m в core/assumptions.py;
      # геометрию петли заказчик не просит (№38), нужна ширина зоны манёвра.
      gap: >-
        Минимального радиуса разворота нет ни в руководстве, ни на сайте.
        Для расчёта он выводится из крейсерской скорости и крена 30° в
        координированном развороте: R = V² / (g · tg 30°). Радиус задаёт
        ширину защитной зоны манёвра на концах галсов.

    takeoff_mode:
      value: catapult
      source: "[201] стр. 115, «Взлет — с пусковой установки»"
    landing_mode:
      value: parachute
      source: "[201] стр. 115, «Посадка — в автоматическом режиме на парашюте»"

    # Заявленная производителем площадь за вылет — с той камерой, с которой её
    # заявляют (штатная камера на странице продукта). В расчёте не используется:
    # площадь считает наша модель. Служит проверкой её правдоподобия
    # (tests/test_catalog_and_assumptions.py).
    survey_area_per_sortie:
      value:
        - {gsd_m: 0.03, area_km2: 15, payload_id: riebo-r4}
        - {gsd_m: 0.10, area_km2: 42, payload_id: riebo-r4}
      source: >-
        [сайт-201], «Площадь съемки за 1 полет: при масштабе 3-10 см/пикс:
        15-42 км²». В руководстве [201] стр. 115 — «7–22 км» (пропущен знак
        степени) без привязки к GSD: цифры руководства старше и в 2 раза
        скромнее. Берём страницу продукта — она и новее, и даёт GSD.

    motor:
      type:
        value: electric_brushless
        source: "[201] стр. 115, «Двигатель — электрический бесколлекторный»"
      power_w:
        value: 220
        source: "[201] стр. 115, «Мощность двигателя 220 Вт»"

    battery:
      cells:
        value: 5
        source: "[201] стр. 116, «Количество ячеек 5»"
      nominal_voltage_v:
        value: 18.5
        source: "[201] стр. 116, «Номинальное напряжение 18,5 В»"
      voltage_limits_v:
        value: [15, 21]
        source: "[201] стр. 116, «Нижний предел 15 В», «Верхний предел 21 В»"
      capacity_mah:
        value: 40000
        source: >-
          [201] стр. 116, «Емкость 40 000 мА·ч». На [сайт-201] — «Две
          аккумуляторные батареи 5S, 34000 mAh»: другая комплектация.
      energy_wh:
        value: 740
        source: >-
          ПРОИЗВОДНАЯ ВЕЛИЧИНА, не из документа: 18,5 В × 40 А·ч = 740 Вт·ч.
          Справочно: модель расхода линейна по времени (заказчик, №35).

    operating_temp_c:
      value: [-20, 40]
      source: "[201] стр. 115, базовая АКБ. С АКБ «Арктика»: от -40 до +20 °C"

    payloads:
      # Riebo R4/R6. Документ [201] стр. 117 даёт фокусное 40 мм И углы обзора
      # 89,84° × 67,16°, а они несовместимы: при 40 мм такие углы требуют
      # матрицы ~80 × 53 мм, какой у этих камер нет. Дилеры называют матрицу
      # полнокадровой. Три согласных источника (фокусное в руководствах 201 и
      # 401, «полнокадровая» у двух дилеров) против одного — расчёт по
      # фокусному и формату, углы отложены в `rejected`. Решение команды,
      # вопрос заказчику — docs/customer_qa.md §4.
      - id: riebo-r4
        name: Фотокамера Riebo R4 (45 Мп)
        kind: rgb
        source: >-
          [201] стр. 117 (45 Мп, фокусное 40 мм); [201-камеры] стр. 44–45
          (несъёмный объектив, R4 — 45 Мп); [Русгеоком-R4]: «45 МП,
          центральный затвор, полнокадровая матрица, объектив 40мм».
          Штатная камера «Геоскан 201 Геодезия» — [сайт-201]
        resolution_mp: 45
        focal_length_mm: 40
        sensor_format: full_frame
        shutter: central
        rejected:
          fov_horizontal_deg: 89.84
          fov_vertical_deg: 67.16
          reason: >-
            [201] стр. 117. Несовместимы с фокусным 40 мм того же документа:
            2·40·tg(89,84°/2) ≈ 80 мм ширины матрицы. По углам высота съёмки
            вышла бы в 2,2 раза ниже.
      - id: riebo-r6
        name: Фотокамера Riebo R6 (61 Мп)
        kind: rgb
        source: >-
          [201] стр. 117 (61 Мп, фокусное 40 мм); [201-камеры] стр. 44 (R6 —
          61 Мп); [DroneMarket-R6]: «61 Мп, полнокадровая, центральный затвор,
          40 мм»
        resolution_mp: 61
        focal_length_mm: 40
        sensor_format: full_frame
        shutter: central
        rejected:
          fov_horizontal_deg: 89.84
          fov_vertical_deg: 67.16
          reason: "[201] стр. 117 — то же расхождение с фокусным, что у Riebo R4"
      - id: sony-rx1rm2
        name: Фотокамера Sony DSC-RX1RM2
        kind: rgb
        source: >-
          [201] стр. 117 (полнокадровая 35,9×24 мм, центральный затвор);
          [Sony-RX1RM2]: «f=35mm», «[3:2] L: 42M (7,952 x 5,304)», «35.9 x
          24.0mm». Объектив несъёмный
        resolution_px: [7952, 5304]
        resolution_mp: 42.4
        sensor_mm: [35.9, 24.0]
        focal_length_mm: 35
        shutter: central
      - id: sony-rx1rm3
        name: Фотокамера Sony DSC-RX1RM3
        kind: rgb
        source: >-
          [201] стр. 117 (RX1RM2/M3, 61 Мп); [Sony-RX1RM3]: «f = 35 mm»,
          «L: 9504 x 6336 (60 M)», «35mm full frame (35.7 x 23.8 mm)».
          Руководство пишет для M3 матрицу 35,9×24 мм — берём паспорт Sony
        resolution_px: [9504, 6336]
        resolution_mp: 61
        sensor_mm: [35.7, 23.8]
        focal_length_mm: 35
        shutter: central
      - id: sony-zv-e10
        name: Фотокамера Sony ZV-E10
        kind: rgb
        source: >-
          [201] стр. 117 (APS-C 23,5×15,6 мм, шторно-щелевой затвор);
          [Sony-ZVE10]: «[3:2] L: 6000 x 4000 (24 M)», байонет E —
          объектив сменный
        resolution_px: [6000, 4000]
        resolution_mp: 24.2
        sensor_mm: [23.5, 15.6]
        focal_length_mm:
          value: null
          gap: >-
            Объектив сменный, в документах Геоскана фокусного нет.
            [Русгеоком-ZVE10] пишет «Объектив 20мм», но иллюстрации
            руководства ([201-камеры] стр. 55) показывают штатный зум 16–50 мм.
            Пока фокусное не известно, съёмка этой камерой не планируется;
            камеру с известным объективом можно завести своей нагрузкой
        shutter: focal_plane
      - id: pollux
        name: Мультиспектральная камера Pollux
        kind: multispectral
        source: "[201] стр. 117; [Gemini] стр. 3–4"
        resolution_px: [1440, 1080]
        resolution_mp: 1.55
        focal_length_mm: 8
        # Размер пикселя взят из спецификации ТОЙ ЖЕ камеры в документе Gemini:
        # [Gemini] стр. 3, «Размер пикселя 3,45 мкм». Не выдумано, перенесено.
        pixel_size_um: 3.45
        fov_diagonal_deg: 43
        shutter: global

    payload_note: >-
      [201] стр. 117, сноска: «тип фотокамер и наличие внутреннего
      GNSS-приемника БВС зависят от комплектации БАС». Состав нагрузки —
      параметр сценария, а не жёсткое свойство борта.

  - id: geoscan-201-t
    name: Геоскан 201 Термо
    type: fixed_wing

    # Планер и АКБ — те же, что у Геоскан 201: [сайт-201Т] даёт ту же
    # продолжительность, протяжённость, ветер, массы, высоты и ссылается на
    # то же руководство [201]. Отличаются нагрузка и заявленная скорость.
    airspeed_min_mps:
      value: 17.8
      source: "[201] стр. 115, «Скорость полета (воздушная) 64–130 км/ч» → 64 км/ч"
    airspeed_max_mps:
      value: 36.1
      source: "[201] стр. 115, «Скорость полета (воздушная) 64–130 км/ч» → 130 км/ч"
    cruise_speed_mps:
      value: 22.2
      source: >-
        [сайт-201Т], «Скорость полета: 80 км/ч» — единственное значение
        скорости на странице (не диапазон и не «до»), принимается как
        крейсерская. Лежит внутри диапазона воздушной скорости [201]

    endurance_s:
      value: 10800
      source: "[сайт-201Т] «Длительность полета: до 3 часов»; [201] стр. 115"
    max_range_m:
      value: 210000
      source: "[сайт-201Т] «Макс. протяженность маршрута: 210 км»"
    max_wind_mps:
      value: 12.0
      source: "[сайт-201Т] «Макс. допустимая скорость ветра: 12 м/с»"

    max_takeoff_mass_kg:
      value: 8.5
      source: "[сайт-201Т] «Макс. взлетная масса: 8,5 кг»"
    max_payload_mass_kg:
      value: 1.5
      source: "[сайт-201Т] «Макс. масса полезной нагрузки: 1,5 кг»"
    wingspan_m:
      value: 2.22
      source: "[сайт-201Т] «размах крыла: 222 см»"

    min_safe_altitude_m:
      value: 100
      source: "[сайт-201Т] «Мин. безопасная высота полета: 100 м»"
    max_altitude_m:
      value: 4000
      source: "[сайт-201Т] «Макс. высота полета: 4000 м»"

    turn_radius_m:
      value: null
      gap: "Как у Геоскан 201: в источниках нет, выводится из скорости и крена"

    takeoff_mode:
      value: catapult
      source: "[сайт-201Т] «Взлет / посадка: с пусковой установки / на парашюте»"
    landing_mode:
      value: parachute
      source: "[сайт-201Т] «Взлет / посадка: с пусковой установки / на парашюте»"

    survey_area_per_sortie:
      value: null
      gap: "[сайт-201Т]: площадь за вылет не указана"

    battery:
      capacity_mah:
        value: 34000
        source: "[сайт-201Т] «Две аккумуляторные батареи 5S, 34000 mAh»"
      energy_wh:
        value: 629
        source: >-
          ПРОИЗВОДНАЯ ВЕЛИЧИНА, не из документа: 18,5 В ([201] стр. 116,
          номинал 5S) × 34 А·ч = 629 Вт·ч. Справочно

    payloads:
      - id: riebo-r4
        name: Фотокамера Riebo R4 (45 Мп)
        kind: rgb
        source: >-
          [сайт-201Т]: «Модернизированная фотограмметрическая камера 45 Мпикс»
          в штатной комплектации; оптика — как у Riebo R4 на Геоскан 201
          ([201] стр. 117, [201-камеры], [Русгеоком-R4])
        resolution_mp: 45
        focal_length_mm: 40
        sensor_format: full_frame
        shutter: central
        rejected:
          fov_horizontal_deg: 89.84
          fov_vertical_deg: 67.16
          reason: "[201] стр. 117 — см. Riebo R4 у Геоскан 201"
      - id: vlm640-t
        name: Тепловизионная камера VLM640-Т
        kind: ir
        source: >-
          [сайт-201Т]: «Камера тепловизионная VLM640-Т с объективом
          NA-L-20-0,8-M», «Разрешение тепловизора: 640×512 пикс»;
          [Фотоника] VLM640 — 640×512, пиксель 17×17 мкм
        resolution_px: [640, 512]
        pixel_size_um: 17
        focal_length_mm:
          value: null
          gap: >-
            Фокусное объектива NA-L-20-0,8-M не опубликовано. Обозначение
            похоже на «20 мм, F/0,8», но расшифровки нет ни у Геоскана, ни у
            производителя — вывод по названию был бы догадкой. Без фокусного
            высоту по GSD не посчитать: ИК-съёмка на этом борту недоступна,
            пока фокусное не задано своей нагрузкой
        shutter: none

    payload_note: >-
      [сайт-201Т]: штатно — тепловизор VLM640-Т и фотокамера 45 Мп. Дилер
      (neramsc.ru) называет RGB-камерой Sony ZV-E10 — расходится с сайтом
      производителя, берём сайт.

  - id: geoscan-lite
    name: Геоскан Lite
    type: fixed_wing

    availability_note: >-
      [сайт-Lite] (снимок 2024-09-15): «БВС Geoscan Lite не доступен для
      заказа». Техподдержка продолжается; борт остаётся в парке эксплуатантов.

    airspeed_min_mps:
      value: 17.8
